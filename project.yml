name: AIChat

options:
  bundleIdPrefix: com.example.aichat
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: "7.11.1"

targets:
  AIChat:
    type: application
    platform: iOS
    sources:
      - path: AIChat
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: GRDB
    info:
      path: AIChat/Info.plist
      properties:
        CFBundleDisplayName: AI Chat
        # Свой тип для перетаскивания чата в папку (ChatDragItem).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.example.aichat.chat-reference
            UTTypeDescription: AI Chat conversation
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification: {}
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Dictation uses the microphone to turn your speech into text. Audio is processed on this device and never saved.
        NSSpeechRecognitionUsageDescription: Dictation turns your speech into text in the message field. It works on this device when your language supports it; otherwise speech is sent to Apple for recognition.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aichat.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: Accent

  AIChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AIChatTests
    dependencies:
      - target: AIChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.aichat.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AIChat:
    build:
      targets:
        AIChat: all
        AIChatTests: [test]
    test:
      targets:
        - AIChatTests
